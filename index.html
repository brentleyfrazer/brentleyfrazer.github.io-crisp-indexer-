<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copula Analyzer | English Prime Engine</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel for in-browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; }
    .inset-neu { box-shadow: inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff; }
    .outset-neu { box-shadow: 6px 6px 12px #bebebe, -6px -6px 12px #ffffff; }
    .outset-neu-pressed { box-shadow: inset 4px 4px 8px #bebebe, inset -4px -4px 8px #ffffff; }
  </style>
</head>
<body class="min-h-screen p-6 md:p-12 text-gray-700">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const COPULA_WORDS = new Set([
      'are', 'am', 'is', 'was', 'were', 'be', 'been', 'being'
    ]);

    const CONTRACTIONS = new Set([
      "wasn't", "isn't", "aren't", "i'm", "you're", "he's", "she's", 
      "it's", "we're", "they're", "there's", "here's", "what's", 
      "that's", "who's", "where's", "when's", "why's", "how's"
    ]);

    function App() {
      const [text, setText] = useState('');
      const [isPressed, setIsPressed] = useState(false);

      const analysis = useMemo(() => {
        if (!text.trim()) return null;

        const words = text.toLowerCase().match(/\b[\w']+\b/g) || [];
        const totalWords = words.length;
        const foundCopulas = [];

        words.forEach((word, index) => {
          if (COPULA_WORDS.has(word)) {
            foundCopulas.push({ word, index, type: 'copula' });
          } else if (CONTRACTIONS.has(word)) {
            foundCopulas.push({ word, index, type: 'contraction' });
          }
        });

        // Sentence-level Bourland Crispiness Index
        const rawSentences = text.match(/[^.?!;:]+[.?!;:]?/g) || [];
        const cleanedSentences = rawSentences.map(s => s.trim()).filter(Boolean);
        const totalSentences = cleanedSentences.length;
        let nonCrispyCount = 0;

        cleanedSentences.forEach(sentence => {
          const sentWords = (sentence.toLowerCase().match(/\b[\w']+\b/g) || []);
          const hasCopula = sentWords.some(w => COPULA_WORDS.has(w) || CONTRACTIONS.has(w));
          if (hasCopula) nonCrispyCount++;
        });

        const crispySentences = Math.max(0, totalSentences - nonCrispyCount);
        const crispinessIndex = totalSentences > 0 ? (crispySentences / totalSentences) : 1.0;
        const percentage = totalWords > 0 ? ((foundCopulas.length / totalWords) * 100).toFixed(2) : 0;

        return {
          totalWords,
          totalSentences,
          crispySentences,
          nonCrispyCount,
          crispinessIndex: crispinessIndex.toFixed(3),
          copulaCount: foundCopulas.length,
          percentage: parseFloat(percentage),
          foundCopulas
        };
      }, [text]);

      return (
        <div class="max-w-6xl mx-auto">
          {/* Header */}
          <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-light tracking-tight text-gray-800 mb-2">
              Copula Analyzer
            </h1>
            <p class="text-xl text-gray-600 font-light mb-1">
              English-Prime Analysis Engine by Dr Brentley Frazer
            </p>
            <p class="text-sm text-gray-500">
              Evaluates text dynamism, removes passive nominalization, and verifies 100% E-Prime compliance.
            </p>
          </div>

          <div class="grid lg:grid-cols-5 gap-8">
            {/* Input Section */}
            <div class="lg:col-span-3 space-y-6">
              <div class="rounded-3xl p-2 inset-neu">
                <textarea
                  value={text}
                  onChange={(e) => setText(e.target.value)}
                  placeholder="Paste or type text here to evaluate for copula occurrences and calculate Crispiness Index..."
                  class="w-full h-72 md:h-96 p-4 bg-transparent resize-none outline-none text-gray-700 placeholder-gray-400 text-lg leading-relaxed"
                />
              </div>

              {text && (
                <button
                  onClick={() => setText('')}
                  onMouseDown={() => setIsPressed(true)}
                  onMouseUp={() => setIsPressed(false)}
                  class={`flex items-center gap-2 px-6 py-3 rounded-2xl text-gray-700 font-medium transition-all ${
                    isPressed ? 'outset-neu-pressed' : 'outset-neu'
                  }`}
                >
                  Clear Text
                </button>
              )}
            </div>

            {/* Results Section */}
            <div class="lg:col-span-2 space-y-6">
              {analysis ? (
                <div class="rounded-3xl p-6 outset-neu space-y-6">
                  {/* Score */}
                  <div class="text-center pb-4 border-b border-gray-300">
                    <div class="text-5xl font-light text-gray-800 mb-1">
                      {analysis.crispinessIndex}
                    </div>
                    <div class="text-xs uppercase tracking-wider text-gray-500">
                      Bourland Crispiness Index (0 to 1.0)
                    </div>
                    <div class="text-xs mt-2 text-gray-600">
                      {analysis.copulaCount === 0 
                        ? '✅ 100% E-Prime Compliant' 
                        : `${analysis.copulaCount} Copula Violations Detected`}
                    </div>
                  </div>

                  {/* Metrics */}
                  <div class="space-y-3 text-sm">
                    <div class="flex justify-between text-gray-600">
                      <span>Total Words:</span>
                      <span class="font-medium text-gray-800">{analysis.totalWords}</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                      <span>Copula Density:</span>
                      <span class="font-medium text-gray-800">{analysis.percentage}%</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                      <span>Sentences Checked:</span>
                      <span class="font-medium text-gray-800">{analysis.totalSentences}</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                      <span>Crispy Sentences:</span>
                      <span class="font-medium text-gray-800">{analysis.crispySentences}</span>
                    </div>
                  </div>

                  {/* Flagged tokens */}
                  {analysis.foundCopulas.length > 0 && (
                    <div class="pt-4 border-t border-gray-300">
                      <div class="text-xs font-semibold uppercase text-gray-500 mb-2">
                        Detected Words:
                      </div>
                      <div class="flex flex-wrap gap-1 max-h-36 overflow-y-auto">
                        {analysis.foundCopulas.map((c, i) => (
                          <span key={i} class="px-2 py-0.5 text-xs bg-red-100 text-red-700 rounded border border-red-200">
                            {c.word}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                <div class="rounded-3xl p-10 text-center outset-neu">
                  <p class="text-gray-500 text-lg">
                    Enter text in the left panel to execute real-time analysis.
                  </p>
                </div>
              )}
            </div>
          </div>

          {/* Academic Footer Links */}
          <div class="mt-12 pt-6 border-t border-gray-300 text-center text-xs text-gray-500 space-y-1">
            <div>Doctoral Exegesis: <em>Notes on a Scoundrel</em> (Griffith University, 2017)</div>
            <div>
              <a 
                href="https://dx.doi.org/10.25904/1912/527" 
                target="_blank" 
                class="underline hover:text-gray-700"
              >
                DOI: 10.25904/1912/527
              </a>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

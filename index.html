<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MS CRISP | Dynamic Text | Semantic Technologies</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #d8d8d8; font-family: system-ui, -apple-system, sans-serif; }
    .inset-neu { box-shadow: inset 5px 5px 10px #b8b8b8, inset -5px -5px 10px #f8f8f8; }
    .outset-neu { box-shadow: 6px 6px 14px #bebebe, -6px -6px 14px #f2f2f2; }
    .outset-neu-sm { box-shadow: 3px 3px 8px #bebebe, -3px -3px 8px #f2f2f2; }
    .outset-neu-pressed { box-shadow: inset 3px 3px 6px #bebebe, inset -3px -3px 6px #ffffff; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // 8 Classical Tenses + Color Palette 
    const TENSE_CONFIG = {
      am:    { label: 'AM',    color: '#c99665', textClass: 'text-[#c99665]', bgClass: 'bg-[#c99665]' },
      is:    { label: 'IS',    color: '#a8b075', textClass: 'text-[#a8b075]', bgClass: 'bg-[#a8b075]' },
      are:   { label: 'ARE',   color: '#76a0b8', textClass: 'text-[#76a0b8]', bgClass: 'bg-[#76a0b8]' },
      was:   { label: 'WAS',   color: '#658c83', textClass: 'text-[#658c83]', bgClass: 'bg-[#658c83]' },
      were:  { label: 'WERE',  color: '#84718c', textClass: 'text-[#84718c]', bgClass: 'bg-[#84718c]' },
      be:    { label: 'BE',    color: '#9c5c5c', textClass: 'text-[#9c5c5c]', bgClass: 'bg-[#9c5c5c]' },
      been:  { label: 'BEEN',  color: '#802344', textClass: 'text-[#802344]', bgClass: 'bg-[#802344]' },
      being: { label: 'BEING', color: '#0971b3', textClass: 'text-[#0971b3]', bgClass: 'bg-[#0971b3]' }
    };

    const CONTRACTION_MAP = {
      "i'm": 'am',
      "it's": 'is', "he's": 'is', "she's": 'is', "that's": 'is', "there's": 'is',
      "here's": 'is', "what's": 'is', "who's": 'is', "where's": 'is', "how's": 'is',
      "isn't": 'is',
      "you're": 'are', "we're": 'are', "they're": 'are', "aren't": 'are',
      "wasn't": 'was',
      "weren't": 'were'
    };

    // Heuristic generator for E-Prime revisions
    function suggestRevision(sentence, forbiddenTokens) {
      let revised = sentence;
      
      // Pattern 1: Progressive aspect (was running -> ran; is singing -> sings)
      revised = revised.replace(/\b(was|were)\s+([a-z]+)ing\b/gi, (match, aux, verb) => {
        return verb.endsWith('e') ? verb + 'd' : verb + 'ed';
      });
      revised = revised.replace(/\b(is|am)\s+([a-z]+)ing\b/gi, (match, aux, verb) => verb + 's');
      revised = revised.replace(/\bare\s+([a-z]+)ing\b/gi, (match, aux, verb) => verb);

      // Pattern 2: Existential "There is / There was"
      revised = revised.replace(/\bThere\s+(is|was)\s+a\s+([a-z]+)\b/gi, "A $2 existed");
      revised = revised.replace(/\bThere\s+(are|were)\s+([a-z]+)\b/gi, "$2 existed");

      // Pattern 3: Predicative identity replacement cues
      revised = revised.replace(/\b(is|was|are|were)\b/gi, "[acts as / appears / becomes]");

      return revised;
    }

    function App() {
      const [text, setText] = useState('');
      const [selectedSentence, setSelectedSentence] = useState(null);

      const analysis = useMemo(() => {
        if (!text.trim()) return null;

        const words = text.toLowerCase().match(/\b[\w']+\b/g) || [];
        const totalWords = words.length;

        // Categorize occurrences by the 8 root tenses
        const tenseCounts = { am: 0, is: 0, are: 0, was: 0, were: 0, be: 0, been: 0, being: 0 };
        const foundCopulas = [];

        words.forEach((word, index) => {
          let root = null;
          if (TENSE_CONFIG[word]) root = word;
          else if (CONTRACTION_MAP[word]) root = CONTRACTION_MAP[word];

          if (root) {
            tenseCounts[root]++;
            foundCopulas.push({ word, root, index });
          }
        });

        // Sentence-level analysis for Bourland Crispness Index
        const rawSentences = text.match(/[^.?!;:]+[.?!;:]?/g) || [];
        const sentences = rawSentences.map(s => s.trim()).filter(Boolean).map(sent => {
          const sentWords = (sent.toLowerCase().match(/\b[\w']+\b/g) || []);
          const flagged = [];
          sentWords.forEach(w => {
            if (TENSE_CONFIG[w]) flagged.push({ word: w, root: w });
            else if (CONTRACTION_MAP[w]) flagged.push({ word: w, root: CONTRACTION_MAP[w] });
          });

          return {
            raw: sent,
            isCrispy: flagged.length === 0,
            violations: flagged,
            suggestion: flagged.length > 0 ? suggestRevision(sent, flagged) : null
          };
        });

        const totalSentences = sentences.length;
        const crispySentences = sentences.filter(s => s.isCrispy).length;
        const crispinessIndex = totalSentences > 0 ? (crispySentences / totalSentences) : 1.0;
        const copulaTotal = foundCopulas.length;

        return {
          totalWords,
          totalSentences,
          crispySentences,
          crispinessIndex,
          copulaTotal,
          tenseCounts,
          sentences,
          foundCopulas
        };
      }, [text]);

      return (
        <div className="max-w-7xl mx-auto space-y-8">
          {/* Header */}
          <div className="text-center space-y-2">
            <h1 className="text-4xl md:text-5xl font-light tracking-tight text-gray-900">
              Dynamic Text
            </h1>
            <p className="text-sm uppercase tracking-widest text-gray-500 font-semibold">
              Semantic Technologies • Dr. Brentley Frazer
            </p>
          </div>

          {/* Main Grid */}
          <div className="grid lg:grid-cols-12 gap-8">
            
            {/* Left Column: Editor & Sentence Inspector (7 cols) */}
            <div className="lg:col-span-7 space-y-6">
              <div className="rounded-3xl p-2 inset-neu">
                <textarea
                  value={text}
                  onChange={(e) => { setText(e.target.value); setSelectedSentence(null); }}
                  placeholder="Type or paste prose to measure Crispiness and eliminate copula verbs..."
                  className="w-full h-80 p-5 bg-transparent resize-none outline-none text-gray-800 placeholder-gray-400 text-lg leading-relaxed"
                />
              </div>

              {/* Tense Legend */}
              <div className="flex flex-wrap gap-2 items-center justify-center pt-2">
                {Object.entries(TENSE_CONFIG).map(([key, config]) => (
                  <div key={key} className="flex items-center gap-1.5 px-3 py-1 rounded-full outset-neu-sm text-xs font-bold text-gray-700">
                    <span className="w-3 h-3 rounded-full" style={{ backgroundColor: config.color }}></span>
                    <span>{config.label}</span>
                    <span className="text-gray-400 font-normal">
                      {analysis ? `(${analysis.tenseCounts[key]})` : ''}
                    </span>
                  </div>
                ))}
              </div>

              {/* Interactive Sentence Inspector (Feature 4 - Premium Suggestions) */}
              {analysis && (
                <div className="rounded-3xl p-6 outset-neu space-y-4">
                  <div className="flex justify-between items-center border-b border-gray-300 pb-3">
                    <h3 className="font-semibold text-gray-700 text-sm tracking-wide uppercase">
                      Sentence Flow & Suggestion Engine
                    </h3>
                    <span className="text-xs px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-300 font-semibold">
                      Premium Suite Feature
                    </span>
                  </div>

                  <p className="text-xs text-gray-500">
                    Click any highlighted sentence below to view non-copular restructuring suggestions.
                  </p>

                  <div className="max-h-60 overflow-y-auto space-y-2 pr-2 text-sm leading-relaxed">
                    {analysis.sentences.map((sent, i) => (
                      <div
                        key={i}
                        onClick={() => setSelectedSentence(sent)}
                        className={`p-2.5 rounded-xl cursor-pointer transition-all ${
                          sent.isCrispy 
                            ? 'bg-emerald-50/60 border border-emerald-200 hover:bg-emerald-100/50' 
                            : 'bg-rose-50/60 border border-rose-200 hover:bg-rose-100/60'
                        } ${selectedSentence === sent ? 'ring-2 ring-gray-600' : ''}`}
                      >
                        <span className="font-mono text-xs text-gray-400 mr-2">[{i + 1}]</span>
                        <span>{sent.raw}</span>
                      </div>
                    ))}
                  </div>

                  {selectedSentence && !selectedSentence.isCrispy && (
                    <div className="mt-4 p-4 rounded-2xl bg-white border border-gray-200 space-y-2 outset-neu-sm">
                      <div className="text-xs font-bold text-rose-700 uppercase tracking-wide">
                        Detected Copula: {selectedSentence.violations.map(v => v.word).join(', ')}
                      </div>
                      <div className="text-xs text-gray-500">Heuristic E-Prime Revision:</div>
                      <div className="text-sm font-medium text-gray-800 bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                        "{selectedSentence.suggestion}"
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* Right Column: Visual Meters (5 cols) */}
            <div className="lg:col-span-5 space-y-6">

              {/* Bourland Crispness Meter (Feature 3) */}
              <div className="rounded-3xl p-6 outset-neu space-y-4">
                <div className="text-center">
                  <div className="text-5xl font-light text-gray-800">
                    {analysis ? analysis.crispinessIndex.toFixed(3) : '1.000'}
                  </div>
                  <div className="text-xs uppercase tracking-wider text-gray-500 font-semibold mt-1">
                    Bourland Crispness Index (C.I.)
                  </div>
                </div>

                {/* Static vs Dynamic Bridge Graphic */}
                <div className="relative pt-6 pb-2">
                  <div className="flex justify-between text-xs font-bold tracking-wider mb-1">
                    <span className="text-[#8c5244]">STATIC</span>
                    <span className="text-gray-400 font-normal">50% Median</span>
                    <span className="text-[#2b7a4b]">DYNAMIC</span>
                  </div>

                  {/* Meter Track */}
                  <div className="h-6 rounded-full bg-gray-300 inset-neu relative overflow-hidden flex items-center">
                    {/* Median Line at 50% */}
                    <div className="absolute left-1/2 top-0 bottom-0 w-0.5 bg-gray-500 z-10 opacity-70"></div>
                    
                    {/* Dynamic Bar */}
                    <div 
                      className="h-full transition-all duration-500 rounded-full"
                      style={{
                        width: `${(analysis ? analysis.crispinessIndex : 1) * 100}%`,
                        backgroundColor: (analysis ? analysis.crispinessIndex : 1) >= 0.5 ? '#658c83' : '#a86565'
                      }}
                    ></div>
                  </div>

                  <div className="flex justify-between text-[10px] text-gray-400 mt-1 font-mono">
                    <span>0.0 (Pure Passive)</span>
                    <span>0.50 (Fiction Avg)</span>
                    <span>1.0 (Pure E-Prime)</span>
                  </div>
                </div>

                <div className="text-xs text-gray-600 bg-gray-200/50 p-3 rounded-xl leading-relaxed">
                  {analysis && analysis.crispinessIndex < 0.5 && (
                    <span><strong>Static (Deity Mode):</strong> Heavy reliance on the copula. Identity and predication displace active agency.</span>
                  )}
                  {analysis && analysis.crispinessIndex >= 0.5 && analysis.crispinessIndex < 1.0 && (
                    <span><strong>Dynamic:</strong> Exceeds Bourland’s 50% professional baseline. Prose exhibits strong active verbal flow.</span>
                  )}
                  {analysis && analysis.crispinessIndex === 1.0 && (
                    <span><strong>Optimal:</strong> 100% English Prime compliance. No copula occurrences detected.</span>
                  )}
                  {!analysis && <span>Enter text to evaluate agency against Bourland’s index.</span>}
                </div>
              </div>

              {/* Tense Distribution SVG Wheel (Features 1 & 2) */}
              <div className="rounded-3xl p-6 outset-neu space-y-4 text-center">
                <h3 className="text-xs font-semibold uppercase tracking-wider text-gray-500">
                  Eight Tenses Radial Distribution
                </h3>

                <div className="flex justify-center items-center py-2">
                  <svg width="220" height="220" viewBox="0 0 220 220">
                    {/* Outer Dial */}
                    <circle cx="110" cy="110" r="100" fill="#c4b5a5" stroke="#403833" strokeWidth="6" />
                    
                    {/* Radial 8 Spokes & Indicators */}
                    {Object.keys(TENSE_CONFIG).map((key, index) => {
                      const angle = (index * 45) * (Math.PI / 180);
                      const spokeX = 110 + 100 * Math.cos(angle);
                      const spokeY = 110 + 100 * Math.sin(angle);
                      
                      const orbAngle = (index * 45 + 22.5) * (Math.PI / 180);
                      const orbX = 110 + 65 * Math.cos(orbAngle);
                      const orbY = 110 + 65 * Math.sin(orbAngle);

                      const count = analysis ? analysis.tenseCounts[key] : 0;
                      const hasCount = count > 0;

                      return (
                        <g key={key}>
                          {/* Segment dividing line */}
                          <line x1="110" y1="110" x2={spokeX} y2={spokeY} stroke="#403833" strokeWidth="3" />
                          
                          {/* Color Orb */}
                          <circle 
                            cx={orbX} 
                            cy={orbY} 
                            r={hasCount ? "20" : "16"} 
                            fill={TENSE_CONFIG[key].color} 
                            stroke={hasCount ? "#ffffff" : "#403833"}
                            strokeWidth={hasCount ? "3" : "1.5"}
                            className="transition-all duration-300"
                          />
                          <text 
                            x={orbX} 
                            y={orbY + 4} 
                            textAnchor="middle" 
                            fontSize={hasCount ? "11" : "9"} 
                            fontWeight="bold" 
                            fill="#ffffff"
                          >
                            {count > 0 ? count : TENSE_CONFIG[key].label}
                          </text>
                        </g>
                      );
                    })}

                    {/* Central Hub */}
                    <circle cx="110" cy="110" r="18" fill="#403833" />
                    <circle cx="110" cy="110" r="6" fill="#e0e0e0" />
                  </svg>
                </div>

                <div className="text-xs text-gray-500 font-mono">
                  Total Copulas Detected: {analysis ? analysis.copulaTotal : 0}
                </div>
              </div>

            </div>
          </div>

          {/* Academic Attribution Footer */}
          <div className="pt-6 border-t border-gray-400/50 text-center text-xs text-gray-500 space-y-1">
            <div><strong>Dynamic Text: Semantic Technologies</strong> • https://dynamictext.dev • (c) Dr Brentley Frazer 2017 - 2026 • Based on Bourland’s Definitional Semantic Equations</div>
            <div>Exegesis: <em>Notes on a Scoundrel</em> (Griffith University) • DOI: 10.25904/1912/527</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
